name: muzakraty
description: "Muzakraty - Egyptian University Learning Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  go_router: ^15.1.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Video & Media
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Screen Security
  # (See MainActivity.kt for Android FLAG_SECURE, AppDelegate.swift for iOS)

  # Auth & Backend
  supabase_flutter: ^2.8.4
  # firebase_core: ^3.13.0
  # firebase_auth: ^5.6.0
  # cloud_firestore: ^5.6.7

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Utils
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.0+3
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# App Launcher Icons Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  image_path_ios: "assets/images/logoback.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#121638"
    theme_color: "#3949AB"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/images/logo.png
    - assets/images/logoback.png
